server.address=0.0.0.0
server.port=${PORT:8080}
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}
spring.datasource.username=${DAC_DB_USER}
spring.datasource.password=${DAC_DB_PASSWORD}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=15
server.error.include-message=never
dac.importar-inicial=${DAC_IMPORTAR_INICIAL:true}
