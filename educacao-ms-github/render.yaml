# Plano gratuito para demonstração: conferir limites no painel antes de criar.
services:
  - type: web
    name: educacao-ms-dac
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/filtros
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: DAC_IMPORTAR_INICIAL
        value: "true"
      - key: PGHOST
        fromDatabase:
          name: educacao-ms-dac-db
          property: host
      - key: PGDATABASE
        fromDatabase:
          name: educacao-ms-dac-db
          property: database
      - key: DAC_DB_USER
        fromDatabase:
          name: educacao-ms-dac-db
          property: user
      - key: DAC_DB_PASSWORD
        fromDatabase:
          name: educacao-ms-dac-db
          property: password
databases:
  - name: educacao-ms-dac-db
    plan: free
    region: oregon
    databaseName: educacao_ms
    user: educacao_dac
    ipAllowList: []
